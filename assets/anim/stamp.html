<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도담이 칭찬 도장판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 배치: 하늘 배경 위에 흰 모둠 카드 6장(3×2), 카드마다 도장 칸 5×2. 도담이 그림의 하늘·풀밭·갈색 선을 그대로 가져온 한 가지 밝은 세계. */
:root{
  color-scheme: light;
  --sky:#2ec0ff;
  --sky-soft:#bfeaff;
  --grass:#6cc22a;
  --ink:#3a1d0a;
  --paper:#ffffff;
  --blank:#eef7fd;
  --blank-line:#b9d9ec;
  --gold:#ffc400;
  --danger:#e5484d;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  font-family:var(--font);
  color:var(--ink);
  background:
    linear-gradient(to bottom, var(--sky) 0%, var(--sky-soft) 78%, var(--grass) 78%, var(--grass) 100%);
  background-attachment:fixed;
  padding:clamp(14px,1.6vw,32px) clamp(16px,2.2vw,44px) clamp(20px,2.4vw,44px);
  display:flex;flex-direction:column;gap:clamp(12px,1.4vw,26px);
}
header{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:12px 24px;
}
.title{display:flex;align-items:center;gap:clamp(10px,1.2vw,22px)}
.title img{
  width:clamp(56px,5.4vw,104px);height:clamp(56px,5.4vw,104px);
  border-radius:50%;border:4px solid var(--paper);
  box-shadow:0 4px 0 rgba(58,29,10,.25);
}
h1{
  margin:0;font-weight:400;line-height:1.1;
  font-size:clamp(2rem,4.2vw,5rem);
  color:var(--paper);
  text-shadow:0 4px 0 rgba(58,29,10,.35);
  text-wrap:balance;
}
.total{
  background:var(--paper);border-radius:999px;
  padding:.35em 1em;font-size:clamp(1.2rem,2vw,2.4rem);
  box-shadow:0 4px 0 rgba(58,29,10,.25);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.total b{font-weight:400;color:var(--danger)}

main{
  display:grid;gap:clamp(12px,1.4vw,26px);
  grid-template-columns:repeat(3,minmax(0,1fr));
}
@media (max-width:980px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){main{grid-template-columns:1fr}}

.group{
  position:relative;
  background:var(--paper);
  border-radius:clamp(18px,1.6vw,30px);
  border:5px solid var(--paper);
  border-top:clamp(12px,1vw,18px) solid var(--c);
  padding:clamp(10px,1vw,20px) clamp(12px,1.2vw,24px) clamp(14px,1.3vw,26px);
  box-shadow:0 6px 0 rgba(58,29,10,.22);
  display:flex;flex-direction:column;gap:clamp(8px,.9vw,16px);
}
.group.king{
  border-color:var(--gold);border-top-color:var(--gold);
  background:#fffbe6;
}
.head{display:flex;align-items:center;gap:10px}
.name{
  flex:1;min-width:0;
  font:inherit;color:var(--ink);
  font-size:clamp(1.6rem,2.7vw,3.2rem);line-height:1.2;
  background:transparent;border:0;border-bottom:4px dashed transparent;
  border-radius:8px;padding:.05em .2em;margin-left:-.2em;
  cursor:pointer;text-overflow:ellipsis;
}
.name:hover{border-bottom-color:var(--blank-line)}
.name:focus{outline:none;background:var(--blank);border-bottom-color:var(--c);cursor:text}
.count{
  flex:none;
  background:var(--c);color:#fff;border-radius:999px;
  padding:.2em .7em;font-size:clamp(1.1rem,1.7vw,2rem);
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.22);
}
.crown{
  position:absolute;right:clamp(10px,1vw,20px);top:0;
  transform:translateY(-62%) rotate(6deg);
  display:none;align-items:center;gap:.3em;
  background:var(--gold);color:var(--ink);
  border:4px solid var(--paper);border-radius:999px;
  padding:.15em .7em .15em .5em;
  font-size:clamp(1.3rem,2.1vw,2.5rem);
  box-shadow:0 4px 0 rgba(58,29,10,.3);
  z-index:2;white-space:nowrap;
}
.crown svg{width:1.1em;height:1.1em;flex:none}
.group.king .crown{display:flex}
.group.king .count{display:none}
.group.king .crown.pop{animation:crown .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes crown{
  0%{transform:translateY(-62%) rotate(-20deg) scale(0)}
  100%{transform:translateY(-62%) rotate(6deg) scale(1)}
}

.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,.7vw,14px)}
.slot{
  position:relative;aspect-ratio:1;
  font:inherit;padding:0;cursor:pointer;
  border-radius:50%;
  background:var(--blank);
  border:3px dashed var(--blank-line);
  color:var(--blank-line);
  font-size:clamp(1.1rem,1.8vw,2.2rem);
  display:grid;place-items:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.slot:hover{border-color:var(--c);color:var(--c)}
.slot:focus-visible,.btn:focus-visible{outline:5px solid var(--ink);outline-offset:3px}
.slot.on{border-color:transparent;background:transparent}
.slot.on .num{visibility:hidden}
.stamp{
  position:absolute;inset:-3px;border-radius:50%;
  background-image:var(--dodam);background-size:100% 100%;
  border:clamp(3px,.35vw,6px) solid var(--c);
  box-shadow:0 3px 0 rgba(58,29,10,.25);
  transform:rotate(var(--r,0deg));
  display:none;
}
.slot.on .stamp{display:block}
.slot.hit .stamp{animation:kwang .42s cubic-bezier(.3,.7,.3,1)}
@keyframes kwang{
  0%{transform:scale(3) rotate(-28deg);opacity:0}
  50%{transform:scale(.82) rotate(var(--r));opacity:1}
  72%{transform:scale(1.1) rotate(var(--r))}
  100%{transform:scale(1) rotate(var(--r))}
}
.slot.hit::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:6px solid var(--c);pointer-events:none;
  animation:ring .5s .18s ease-out both;
}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.kwang{
  position:absolute;left:50%;top:-10%;z-index:3;pointer-events:none;
  color:var(--danger);font-size:clamp(1.6rem,2.6vw,3.2rem);white-space:nowrap;
  text-shadow:-3px 0 #fff,3px 0 #fff,0 -3px #fff,0 3px #fff;
  animation:word .75s .16s ease-out both;
}
@keyframes word{
  0%{transform:translate(-50%,20%) scale(.3) rotate(-10deg);opacity:0}
  25%{transform:translate(-50%,-30%) scale(1.25) rotate(-10deg);opacity:1}
  70%{transform:translate(-50%,-55%) scale(1) rotate(-10deg);opacity:1}
  100%{transform:translate(-50%,-90%) scale(1) rotate(-10deg);opacity:0}
}
.group.shake{animation:shake .3s .16s}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(0,5px)}
  50%{transform:translate(-3px,-2px)}
  75%{transform:translate(3px,2px)}
}

footer{display:flex;align-items:center;justify-content:center;gap:16px 28px;flex-wrap:wrap}
.hint{
  margin:0;font-size:clamp(1rem,1.5vw,1.8rem);color:#fff;
  text-shadow:0 2px 0 rgba(58,29,10,.45);
}
.btn{
  font:inherit;cursor:pointer;
  font-size:clamp(1.3rem,2vw,2.4rem);
  padding:.4em 1.3em;border-radius:999px;
  border:4px solid var(--ink);
  background:var(--paper);color:var(--ink);
  box-shadow:0 5px 0 var(--ink);
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.warn{background:var(--danger);color:#fff}

dialog{
  font-family:var(--font);color:var(--ink);
  border:6px solid var(--ink);border-radius:28px;
  padding:clamp(20px,2.4vw,44px);max-width:min(92vw,720px);text-align:center;
  background:var(--paper);
}
dialog::backdrop{background:rgba(20,60,90,.55)}
dialog h2{margin:0 0 .3em;font-weight:400;font-size:clamp(1.8rem,3vw,3.4rem)}
dialog p{margin:0 0 1em;font-size:clamp(1.2rem,1.8vw,2.1rem)}
dialog .row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

@media (prefers-reduced-motion:reduce){
  .slot.hit .stamp,.slot.hit::after,.kwang,.group.shake,.group.king .crown.pop{animation:none}
  .kwang{display:none}
}
</style>
</head>
<body>
<header>
  <div class="title">
    <img id="face" alt="우리 반 캐릭터 도담이">
    <h1>도담이 칭찬 도장판</h1>
  </div>
  <div class="total" aria-live="polite">모은 도장 <b id="total">0</b>개</div>
</header>

<main id="board"></main>

<footer>
  <p class="hint">빈칸을 누르면 도장 쾅! 다시 누르면 지워져요. 모둠 이름도 눌러서 바꿀 수 있어요.</p>
  <button type="button" class="btn" id="clear-all">모두 지우기</button>
</footer>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">도장을 모두 지울까요?</h2>
  <p>모둠 이름은 그대로 남아요.</p>
  <div class="row">
    <button type="button" class="btn" id="confirm-no">그만두기</button>
    <button type="button" class="btn warn" id="confirm-yes">모두 지우기</button>
  </div>
</dialog>

<canvas id="confetti" aria-hidden="true"></canvas>

const GROUPS = 6, SLOTS = 10, KEY = "dodam-stamp-board-v1";
const COLORS = ["#ff5a5f","#ff9416","#58b80f","#10b3a3","#2f8cff","#a35cf5"];
const TILT = [-8,5,-3,9,-6,4,-10,7,-4,6];
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

document.documentElement.style.setProperty("--dodam", `url("${DODAM}")`);
document.getElementById("face").src = DODAM;

/* ---------- 상태 ---------- */
function fresh(){
  return {
    names: Array.from({length:GROUPS}, (_, i) => `${i+1}모둠`),
    stamps: Array.from({length:GROUPS}, () => Array(SLOTS).fill(false))
  };
}
function load(){
  const s = fresh();
  try{
    const saved = JSON.parse(localStorage.getItem(KEY));
    if(saved){
      for(let g=0; g<GROUPS; g++){
        if(typeof saved.names?.[g] === "string" && saved.names[g].trim()) s.names[g] = saved.names[g];
        for(let i=0; i<SLOTS; i++) s.stamps[g][i] = !!saved.stamps?.[g]?.[i];
      }
    }
  }catch(e){}
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const state = load();
const countOf = g => state.stamps[g].filter(Boolean).length;

/* ---------- 화면 만들기 ---------- */
const board = document.getElementById("board");
const cards = [];
const CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18l1.5-11-5.5 4L12 4 7 12 1.5 8z" fill="#3a1d0a"/></svg>';

for(let g=0; g<GROUPS; g++){
  const card = document.createElement("section");
  card.className = "group";
  card.style.setProperty("--c", COLORS[g]);
  card.innerHTML = `
    <div class="crown">${CROWN}칭찬 왕</div>
    <div class="head">
      <input class="name" id="name-${g}" type="text" maxlength="10" autocomplete="off" spellcheck="false" aria-label="${g+1}번째 모둠 이름 (눌러서 바꾸기)">
      <span class="count" id="count-${g}"></span>
    </div>
    <div class="slots"></div>`;
  const name = card.querySelector(".name");
  name.value = state.names[g];
  name.addEventListener("focus", () => name.select());
  name.addEventListener("input", () => { state.names[g] = name.value; save(); });
  name.addEventListener("keydown", e => { if(e.key === "Enter") name.blur(); });
  name.addEventListener("blur", () => {
    if(!name.value.trim()){ name.value = `${g+1}모둠`; }
    state.names[g] = name.value; save();
  });

  const slots = card.querySelector(".slots");
  for(let i=0; i<SLOTS; i++){
    const b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.id = `slot-${g}-${i}`;
    b.style.setProperty("--r", TILT[(i + g*3) % TILT.length] + "deg");
    b.innerHTML = `<span class="num">${i+1}</span><span class="stamp"></span>`;
    b.addEventListener("click", () => toggle(g, i, b));
    slots.appendChild(b);
  }
  board.appendChild(card);
  cards.push(card);
}

function paint(g){
  const card = cards[g], n = countOf(g);
  card.querySelectorAll(".slot").forEach((b, i) => {
    const on = state.stamps[g][i];
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
    b.setAttribute("aria-label", `${i+1}번 칸, ${on ? "도장 찍힘. 누르면 지우기" : "빈칸. 누르면 도장 찍기"}`);
  });
  card.querySelector(".count").textContent = `${n} / ${SLOTS}`;
  card.classList.toggle("king", n === SLOTS);
  let total = 0; for(let k=0; k<GROUPS; k++) total += countOf(k);
  document.getElementById("total").textContent = total;
}
for(let g=0; g<GROUPS; g++) paint(g);

/* ---------- 도장 찍기 ---------- */
function toggle(g, i, b){
  const on = !state.stamps[g][i];
  state.stamps[g][i] = on;
  save();
  b.classList.remove("hit");
  b.querySelectorAll(".kwang").forEach(k => k.remove());
  paint(g);
  if(!on) return;

  void b.offsetWidth;            // 움직임을 처음부터 다시
  b.classList.add("hit");
  const card = cards[g];
  if(!calm){
    const word = document.createElement("span");
    word.className = "kwang"; word.textContent = "쾅!"; word.setAttribute("aria-hidden", "true");
    b.appendChild(word);
    word.addEventListener("animationend", () => word.remove());
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
  setTimeout(() => b.classList.remove("hit"), 900);

  if(countOf(g) === SLOTS){
    const crown = card.querySelector(".crown");
    crown.classList.remove("pop"); void crown.offsetWidth; crown.classList.add("pop");
    const r = card.getBoundingClientRect();
    setTimeout(() => party(r.left + r.width/2, r.top + r.height/3), 220);
  }
}

/* ---------- 꽃가루 ---------- */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let bits = [], running = false;
function fit(){
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", fit); fit();

function party(x, y){
  if(calm) return;
  const size = Math.max(8, innerWidth / 130);
  for(let i=0; i<170; i++){
    const a = Math.random() * Math.PI * 2, v = 5 + Math.random() * 13;
    bits.push({
      x, y, vx: Math.cos(a) * v * 1.25, vy: Math.sin(a) * v - 7,
      w: size * (.6 + Math.random()), h: size * (.35 + Math.random() * .5),
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      color: [...COLORS, "#ffc400", "#ffffff"][i % 8],
      round: i % 5 === 0, life: 0, max: 150 + Math.random() * 70
    });
  }
  if(!running){ running = true; requestAnimationFrame(step); }
}
function step(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(p => p.life < p.max && p.y < innerHeight + 60);
  for(const p of bits){
    p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save();
    cx.globalAlpha = Math.min(1, (p.max - p.life) / 30);
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.scale(1, Math.cos(p.life * .12 + p.rot));
    cx.fillStyle = p.color;
    if(p.round){ cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.29); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  if(bits.length) requestAnimationFrame(step);
  else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- 모두 지우기 ---------- */
const dlg = document.getElementById("confirm");
document.getElementById("clear-all").addEventListener("click", () => {
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
});
document.getElementById("confirm-no").addEventListener("click", () => dlg.close());
document.getElementById("confirm-yes").addEventListener("click", () => {
  for(let g=0; g<GROUPS; g++){ state.stamps[g].fill(false); }
  save();
  for(let g=0; g<GROUPS; g++) paint(g);
  dlg.close();
});
</script>
