<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도담이의 발표 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1206;
    --sky1:#2fc1ff;
    --sky2:#a8e8ff;
    --yellow:#ffcc0d;
    --white:#fffdf7;
    --wheel:min(88vh, 54vw);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 34vw 16vh at 12% 104%, #6fbf1f 98%, transparent 100%),
      radial-gradient(ellipse 40vw 20vh at 50% 108%, #9bdc2e 98%, transparent 100%),
      radial-gradient(ellipse 34vw 17vh at 90% 104%, #6fbf1f 98%, transparent 100%),
      linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }
  .cloud{position:fixed;background:#fff;border-radius:999px;opacity:.95;z-index:0}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.a{width:16vw;height:5vw;left:3vw;top:5vh}
  .cloud.a::before{width:7vw;height:7vw;left:2.5vw;top:-3.4vw}
  .cloud.a::after{width:5.5vw;height:5.5vw;left:8vw;top:-2.4vw}
  .cloud.b{width:12vw;height:4vw;right:4vw;top:38vh}
  .cloud.b::before{width:5vw;height:5vw;left:2vw;top:-2.5vw}
  .cloud.b::after{width:4vw;height:4vw;left:6vw;top:-1.6vw}

  main{
    position:relative;z-index:1;
    min-height:100vh;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:3vw;
    padding:3vh 3vw;
  }

  /* 돌림판 */
  .wheel-wrap{position:relative;width:var(--wheel);height:var(--wheel);flex:none}
  #wheel{
    width:100%;height:100%;display:block;
    border-radius:50%;
    filter:drop-shadow(0 1.2vh 0 rgba(43,18,6,.25));
    transition:transform 5.2s cubic-bezier(.12,.62,.08,1);
    will-change:transform;
  }
  .pointer{
    position:absolute;left:50%;top:-2.2%;
    width:11%;height:11%;
    transform:translateX(-50%);
    z-index:3;
    filter:drop-shadow(0 .5vh 0 rgba(43,18,6,.3));
  }
  .hub{
    position:absolute;left:50%;top:50%;
    width:24%;height:24%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:calc(var(--wheel)*.012) solid var(--ink);
    background:#fff center/cover no-repeat;
    z-index:2;
  }

  /* 오른쪽 */
  .side{display:flex;flex-direction:column;gap:2.2vh;min-width:0;height:100%;justify-content:center}
  h1{
    font-weight:400;font-size:clamp(22px,2.6vw,52px);
    color:#fff;
    text-shadow:0 .35vh 0 var(--ink), .2vh 0 0 var(--ink), -.2vh 0 0 var(--ink), 0 -.2vh 0 var(--ink);
    letter-spacing:.02em;
  }
  .talk{display:flex;align-items:flex-end;gap:1.5vw}
  .dodam{
    width:clamp(90px,12vw,230px);aspect-ratio:1;flex:none;
    border-radius:26%;
    border:.5vh solid var(--ink);
    background:#fff center/cover no-repeat;
    box-shadow:0 .9vh 0 rgba(43,18,6,.25);
  }
  .dodam.jump{animation:jump .7s ease 2}
  .dodam.wiggle{animation:wiggle .45s ease-in-out infinite}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-3.5vh) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  .bubble{
    position:relative;flex:1;min-width:0;
    min-height:clamp(120px,27vh,300px);
    background:var(--white);
    border:.5vh solid var(--ink);
    border-radius:4vh;
    padding:1.5vh 1.5vw;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    box-shadow:0 .9vh 0 rgba(43,18,6,.25);
    margin-bottom:3vh;
  }
  .bubble::before,.bubble::after{
    content:"";position:absolute;left:-2.6vh;bottom:3.2vh;
    border-style:solid;border-color:transparent;
  }
  .bubble::before{border-width:1.6vh 2.8vh 1.6vh 0;border-right-color:var(--ink)}
  .bubble::after{left:-1.7vh;border-width:1.6vh 2.8vh 1.6vh 0;border-right-color:var(--white)}
  .bubble .small{font-size:clamp(20px,2.7vw,54px);line-height:1.25;word-break:keep-all}
  .bubble .big{
    font-size:clamp(64px,10.5vw,220px);line-height:1;
    color:#ff4f7b;
    text-shadow:0 .5vh 0 var(--ink);
    -webkit-text-stroke:.25vh var(--ink);
  }
  .bubble.pop .big{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

  .buttons{display:flex;gap:1.2vw;align-items:stretch}
  button{
    font-family:inherit;color:var(--ink);cursor:pointer;
    border:.5vh solid var(--ink);border-radius:999px;
    box-shadow:0 .9vh 0 var(--ink);
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  button:active:not(:disabled){transform:translateY(.6vh);box-shadow:0 .3vh 0 var(--ink)}
  button:focus-visible{outline:.5vh solid #fff;outline-offset:.4vh}
  button:disabled{cursor:default;filter:grayscale(.7) brightness(1.05);opacity:.75}
  #spin{
    flex:1;background:var(--yellow);
    font-size:clamp(30px,4.4vw,90px);
    padding:1.6vh 2vw;
  }
  #reset{
    background:#fff;
    font-size:clamp(18px,2vw,40px);
    padding:1.2vh 1.8vw;white-space:nowrap;
  }

  .picked{
    background:rgba(255,253,247,.92);
    border:.5vh solid var(--ink);border-radius:3vh;
    padding:1.4vh 1.2vw 1.6vh;
  }
  .picked h2{
    font-weight:400;font-size:clamp(18px,1.9vw,38px);
    display:flex;justify-content:space-between;gap:1em;margin-bottom:1vh;
  }
  .picked h2 span{color:#b3541e}
  #list{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:.8vh .4vw;list-style:none;min-height:clamp(30px,4.6vh,54px)}
  #list li{
    font-size:clamp(15px,1.7vw,34px);line-height:1;
    text-align:center;
    padding:.32em 0 .24em;
    background:#ffe98a;border:.3vh solid var(--ink);border-radius:1.4vh;
  }
  #list li.new{background:#ff9db5;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  #list .empty{grid-column:1/-1;background:none;border:none;color:#8a6a55;text-align:left}

  /* 확인 창 */
  .modal{
    position:fixed;inset:0;z-index:10;
    background:rgba(43,18,6,.45);
    display:none;align-items:center;justify-content:center;padding:4vw;
  }
  .modal.open{display:flex}
  .modal .box{
    background:var(--white);border:.6vh solid var(--ink);border-radius:4vh;
    padding:4vh 4vw;text-align:center;max-width:90vw;
    box-shadow:0 1.2vh 0 rgba(43,18,6,.4);
  }
  .modal p{font-size:clamp(24px,3.2vw,64px);margin-bottom:3vh;word-break:keep-all}
  .modal .row{display:flex;gap:1.5vw;justify-content:center;flex-wrap:wrap}
  .modal button{font-size:clamp(22px,2.6vw,52px);padding:1.4vh 2.4vw}
  #yes{background:#ff9db5}
  #no{background:#fff}

  @media (max-aspect-ratio: 11/10){
    :root{--wheel:min(92vw, 62vh)}
    main{grid-template-columns:1fr;justify-items:center;gap:3vh;padding:3vh 4vw 5vh}
    .side{width:100%;height:auto}
    h1{text-align:center}
    #list{grid-template-columns:repeat(8,minmax(0,1fr))}
    #list li{font-size:clamp(15px,4vw,34px)}
  }
  @media (prefers-reduced-motion: reduce){
    #wheel{transition-duration:1.2s}
    .dodam.jump,.dodam.wiggle,.bubble.pop .big,#list li.new{animation:none}
  }
</style>
</head>
<body>
<div class="cloud a" aria-hidden="true"></div>
<div class="cloud b" aria-hidden="true"></div>

<main>
  <div class="wheel-wrap">
    <svg class="pointer" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 96 L14 22 Q50 2 86 22 Z" fill="#ff4f7b" stroke="#2b1206" stroke-width="9" stroke-linejoin="round"/>
    </svg>
    <svg id="wheel" viewBox="-104 -104 208 208" role="img" aria-label="일 번부터 이십사 번까지 적힌 돌림판"></svg>
    <div class="hub" aria-hidden="true"></div>
  </div>

  <section class="side">
    <h1>도담이의 발표 뽑기</h1>

    <div class="talk">
      <div class="dodam" id="dodam" role="img" aria-label="우리 반 캐릭터 도담이"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>

    <div class="buttons">
      <button id="spin" type="button">돌리기</button>
      <button id="reset" type="button">처음부터</button>
    </div>

    <div class="picked">
      <h2>뽑힌 번호 <span id="count"></span></h2>
      <ol id="list"></ol>
    </div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="ask">
  <div class="box">
    <p id="ask">뽑힌 번호를 모두 지우고<br>처음부터 다시 할까요?</p>
    <div class="row">
      <button id="yes" type="button">네, 처음부터</button>
      <button id="no" type="button">아니요</button>
    </div>
  </div>
</div>

  var NS = "http://www.w3.org/2000/svg";

  var wheel = document.getElementById("wheel");
  var bubble = document.getElementById("bubble");
  var dodam = document.getElementById("dodam");
  var spinBtn = document.getElementById("spin");
  var resetBtn = document.getElementById("reset");
  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var modal = document.getElementById("modal");

  dodam.style.backgroundImage = IMG;
  document.querySelector(".hub").style.backgroundImage = IMG;

  var picked = load();
  var rotation = 0;
  var spinning = false;
  var wedges = [], labels = [];

  function load(){
    try{
      var a = JSON.parse(localStorage.getItem(KEY) || "[]");
      if(!Array.isArray(a)) return [];
      var seen = {};
      return a.filter(function(n){
        var ok = Number.isInteger(n) && n >= 1 && n <= TOTAL && !seen[n];
        seen[n] = true; return ok;
      });
    }catch(e){ return []; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(picked)); }catch(e){} }

  function pt(r, deg){
    var a = deg * Math.PI / 180;
    return (r * Math.sin(a)).toFixed(3) + " " + (-r * Math.cos(a)).toFixed(3);
  }
  function el(name, attrs){
    var e = document.createElementNS(NS, name);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildWheel(){
    wheel.appendChild(el("circle", {r:102, fill:"#2b1206"}));
    for(var i = 0; i < TOTAL; i++){
      var a0 = i * STEP, a1 = (i + 1) * STEP, mid = a0 + STEP / 2;
      var w = el("path", {
        d: "M0 0 L" + pt(97, a0) + " A97 97 0 0 1 " + pt(97, a1) + " Z",
        stroke:"#2b1206", "stroke-width":1.1, "stroke-linejoin":"round"
      });
      var t = el("text", {
        transform:"rotate(" + mid + ") translate(0,-78)",
        "text-anchor":"middle", "dominant-baseline":"central",
        "font-size":13.5, "font-family":"inherit"
      });
      t.textContent = String(i + 1);
      wheel.appendChild(w); wheel.appendChild(t);
      wedges.push(w); labels.push(t);
    }
  }

  function paint(){
    for(var i = 0; i < TOTAL; i++){
      var done = picked.indexOf(i + 1) !== -1;
      wedges[i].setAttribute("fill", done ? "#e4e0da" : COLORS[i % COLORS.length]);
      labels[i].setAttribute("fill", done ? "#b9b2a8" : "#2b1206");
    }
    list.innerHTML = "";
    if(!picked.length){
      var li = document.createElement("li");
      li.className = "empty"; li.textContent = "아직 없어요";
      list.appendChild(li);
    }
    picked.forEach(function(n, idx){
      var li = document.createElement("li");
      li.textContent = n;
      if(idx === picked.length - 1 && paint.fresh) li.className = "new";
      list.appendChild(li);
    });
    paint.fresh = false;
    count.textContent = picked.length + "명 / " + TOTAL + "명";
    var left = TOTAL - picked.length;
    spinBtn.disabled = spinning || left === 0;
    spinBtn.textContent = left === 0 ? "모두 뽑았어요" : "돌리기";
    resetBtn.disabled = spinning;
  }

  function say(small, big){
    bubble.classList.remove("pop");
    bubble.innerHTML = "";
    if(big){
      var b = document.createElement("div");
      b.className = "big"; b.textContent = big;
      bubble.appendChild(b);
      void bubble.offsetWidth;
      bubble.classList.add("pop");
    }
    if(small){
      var s = document.createElement("div");
      s.className = "small"; s.textContent = small;
      bubble.appendChild(s);
    }
  }

  function rand(n){
    try{
      var buf = new Uint32Array(1), limit = Math.floor(4294967296 / n) * n;
      do{ crypto.getRandomValues(buf); }while(buf[0] >= limit);
      return buf[0] % n;
    }catch(e){ return Math.floor(Math.random() * n); }
  }

  function spin(){
    if(spinning) return;
    var remain = [];
    for(var n = 1; n <= TOTAL; n++) if(picked.indexOf(n) === -1) remain.push(n);
    if(!remain.length) return;

    var chosen = remain[rand(remain.length)];
    spinning = true;
    paint();
    say("두근두근… 누가 나올까요?");
    dodam.classList.remove("jump");
    dodam.classList.add("wiggle");

    var mid = (chosen - 1) * STEP + STEP / 2;
    var jitter = (Math.random() - 0.5) * (STEP - 5);
    var target = ((-(mid + jitter)) % 360 + 360) % 360;
    var now = ((rotation % 360) + 360) % 360;
    var delta = ((target - now) % 360 + 360) % 360;
    rotation += 360 * 5 + delta;
    wheel.style.transform = "rotate(" + rotation + "deg)";

    var finished = false;
    function finish(){
      if(finished) return;
      finished = true;
      wheel.removeEventListener("transitionend", onEnd);
      clearTimeout(timer);
      spinning = false;
      picked.push(chosen);
      save();
      paint.fresh = true;
      paint();
      dodam.classList.remove("wiggle");
      void dodam.offsetWidth;
      dodam.classList.add("jump");
      var left = TOTAL - picked.length;
      say(left === 0 ? "마지막 친구까지 모두 뽑았어요!" : "발표해 볼까요?", chosen + "번!");
      spinBtn.focus();
    }
    function onEnd(e){ if(e.target === wheel && e.propertyName === "transform") finish(); }
    wheel.addEventListener("transitionend", onEnd);
    var ms = parseFloat(getComputedStyle(wheel).transitionDuration) * 1000 || 0;
    var timer = setTimeout(finish, ms + 400);
  }

  function openModal(){ if(!spinning){ modal.classList.add("open"); document.getElementById("no").focus(); } }
  function closeModal(){ modal.classList.remove("open"); resetBtn.focus(); }
  function resetAll(){
    picked = [];
    save();
    paint();
    dodam.classList.remove("jump","wiggle");
    say("단추를 누르면 내가 번호를 뽑아 줄게요!");
    modal.classList.remove("open");
    spinBtn.focus();
  }

  spinBtn.addEventListener("click", spin);
  resetBtn.addEventListener("click", openModal);
  document.getElementById("yes").addEventListener("click", resetAll);
  document.getElementById("no").addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(modal.classList.contains("open")){
      if(e.key === "Escape") closeModal();
      return;
    }
    if(e.code === "Space" && e.target.tagName !== "BUTTON"){ e.preventDefault(); spin(); }
  });

  buildWheel();
  paint();
  if(picked.length === TOTAL) say("모두 뽑았어요! 처음부터 다시 해 볼까요?");
  else if(picked.length) say("이어서 뽑아 볼까요? 단추를 눌러 주세요!");
  else say("단추를 누르면 내가 번호를 뽑아 줄게요!");
})();
</script>
</body>
</html>
